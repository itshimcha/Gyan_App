<!DOCTYPE html>
<html>
<head>
  <meta name="google-signin-client_id" content="149005867813-dtf3aaluqjnuiul76pecned13uchdg31.apps.googleusercontent.com">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="gyansutra">
  <link rel="apple-touch-icon" href="icons/logo.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logo.png"/>

  <title>Gyansutra</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js');
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <div id="ios-safari-banner" style="
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#1a1a2e;
  color:#fff;
  padding:16px 20px;
  font-family:-apple-system, sans-serif;
  font-size:10px;
  z-index:9999;
  box-shadow:0 -2px 12px rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
">
    <span>To open as app in IOS open website in <b>Safari</b> &rarr; Tap <b>Share</b> &rarr; <b>Add to Home Screen</b></span>
    <button onclick="document.getElementById('ios-safari-banner').style.display='none'; localStorage.setItem('iosSafariBannerDismissed','true');" style="
    background:transparent;
    border:1px solid #fff;
    color:#fff;
    border-radius:6px;
    padding:6px 10px;
    font-size:10 px;
  ">Got it</button>
  </div>

  <script>
    (function() {
      var ua = window.navigator.userAgent;
      var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      var isSafari = /^((?!chrome|crios|fxios|android).)*safari/i.test(ua);
      var isStandalone = window.navigator.standalone === true;
      var dismissed = localStorage.getItem('iosSafariBannerDismissed');

      if (isIOS && !isSafari && !isStandalone && !dismissed) {
        document.getElementById('ios-safari-banner').style.display = 'flex';
      }
    })();
  </script>
</body>
</html>
